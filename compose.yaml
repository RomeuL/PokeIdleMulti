services:
  pokeidle:
    build: .
    init: false
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      WEB_USER: "${WEB_USER:-pokeidle}"
      WEB_PASSWORD: "${WEB_PASSWORD:?Defina WEB_PASSWORD no arquivo .env}"
      SCREEN_WIDTH: "${SCREEN_WIDTH:-1920}"
      SCREEN_HEIGHT: "${SCREEN_HEIGHT:-1080}"
      TZ: "${TZ:-America/Sao_Paulo}"
    volumes:
      - deck-data:/data
    shm_size: "2gb"
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  deck-data:
